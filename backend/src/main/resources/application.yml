spring:
  application:
    name: sharp-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:sharp}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&connectTimeout=10000&socketTimeout=30000
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:sharp123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 跨境高延迟:单条 JDBC 建连约 16s，故常驻热连接、放宽建连超时，避免请求时现建现超时
      connection-timeout: 40000      # 允许首连/扩容耗时(>16s)
      validation-timeout: 10000
      maximum-pool-size: 3
      minimum-idle: 2                # 保持 2 条热连接,请求直接复用
      idle-timeout: 0                # 不回收空闲连接,始终保活
      keepalive-time: 30000          # 每 30s 保活一次,防 NAT 掐断
      max-lifetime: 1800000
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      # 远程库表结构由 schema.sql 手动管理；跨境高延迟下关闭启动时的自动 DDL 元数据扫描
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  servlet:
    context-path: /

# 登录鉴权（JWT）。生产务必用环境变量覆盖 secret 与邀请码。
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:sharp-dev-secret-change-me-please-0123456789}
    expire-hours: ${AUTH_JWT_EXPIRE_HOURS:72}
  invite-code: ${AUTH_INVITE_CODE:sharp-invite}

# 邮件取件（复刻 2fa.run/mail）：Outlook 凭据经 OAuth2 换 access_token 后走 Microsoft Graph 读信。
# 说明：个人账号(outlook.com/hotmail/live)的 IMAP OAuth2 自 2024-12 起有微软服务端回归，改用 Graph。
mail-reader:
  # 个人账号用 consumers；企业/学校账号可改 .../common/oauth2/v2.0/token
  token-url: ${MAIL_TOKEN_URL:https://login.microsoftonline.com/consumers/oauth2/v2.0/token}
  # 走 Graph 读信，token 受众须为 graph.microsoft.com；至少需要 Mail.Read（读信）+ offline_access（续期）。
  # 若该 refreshToken 未同意过 Mail.Read，会返回 AADSTS65001，需重新授权时带上该权限。
  scope: ${MAIL_SCOPE:https://graph.microsoft.com/Mail.Read offline_access}
  # 首选 scope 被拒(AADSTS70000/65001)时的回退：.default 取该 client 已同意的全部 Graph 权限
  scope-fallback: ${MAIL_SCOPE_FALLBACK:https://graph.microsoft.com/.default offline_access}
  # Graph 接口基址，个人账号亦走全球端点 /v1.0
  graph-base: ${MAIL_GRAPH_BASE:https://graph.microsoft.com/v1.0}
  # 默认公共 clientId：当传入/库存的 clientId 不是合法 GUID（缺失或误存了说明文字）时回退到它。
  # 9e5f94bc-... 是这类 2fa Outlook 账号通用的公共 client。
  default-client-id: ${MAIL_DEFAULT_CLIENT_ID:9e5f94bc-e8a4-4e73-b8be-63364c29d753}
  connect-timeout-ms: ${MAIL_CONNECT_TIMEOUT:12000}
  read-timeout-ms: ${MAIL_READ_TIMEOUT:20000}

# Gmail 取件：两种认证都走 imap.gmail.com（Gmail 的 IMAP OAuth 正常可用，无 Outlook 那种回归）。
# 1) OAuth：refreshToken+clientId+clientSecret 经 Google 换 access_token → IMAP(XOAUTH2)
# 2) 应用专用密码：邮箱 + 16 位 app password → IMAP LOGIN
gmail-reader:
  token-url: ${GMAIL_TOKEN_URL:https://oauth2.googleapis.com/token}
  # OAuth 模式所需 scope；应用专用密码模式用不到
  scope: ${GMAIL_SCOPE:https://mail.google.com/}
  imap-host: ${GMAIL_IMAP_HOST:imap.gmail.com}
  imap-port: ${GMAIL_IMAP_PORT:993}
  # Gmail 垃圾箱为特殊文件夹；英文界面为 [Gmail]/Spam，本地化环境可用环境变量覆盖
  spam-folder: ${GMAIL_SPAM_FOLDER:[Gmail]/Spam}
  connect-timeout-ms: ${GMAIL_CONNECT_TIMEOUT:15000}
  # 读信要逐封拉正文，高延迟网络下放宽读超时（前端 fetchMail 超时须 ≥ 此值）
  read-timeout-ms: ${GMAIL_READ_TIMEOUT:45000}